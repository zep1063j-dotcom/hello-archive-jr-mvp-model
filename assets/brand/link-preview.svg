<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f6f3ec"/>
  <g font-family="'Noto Serif KR', Georgia, serif" fill="#2b2925">
    <text x="76" y="88" font-size="31" font-weight="600">Hello Archive <tspan font-style="italic" fill="#a44232">jr</tspan></text>
    <path d="M76 122H1124" fill="none" stroke="#d6cfc2"/>
    <path d="M76 183H105" fill="none" stroke="#a44232" stroke-width="2"/>
    <text x="120" y="189" font-family="sans-serif" font-size="17" letter-spacing="2" fill="#803326">아이의 생각을 모으는 곳</text>
    <text x="72" y="295" font-size="60" font-weight="400" letter-spacing="-3">오늘의 한마디를,</text>
    <text x="72" y="383" font-size="53" font-weight="400" letter-spacing="-3">내일도 기억할 수 있게.</text>
    <text x="77" y="451" font-family="sans-serif" font-size="23" fill="#625c52">매주 하나의 질문으로 남기는 아이의 말과 일상</text>
    <path d="M76 537H1124" fill="none" stroke="#d6cfc2"/>
    <text x="77" y="577" font-family="sans-serif" font-size="18" fill="#625c52">archivejr.helloblank.net</text>
    <text x="1124" y="577" text-anchor="end" font-family="sans-serif" font-size="16" fill="#625c52">한 주의 기록이, 한 권의 이야기로.</text>
  </g>
  <g transform="translate(841 161)">
    <rect x="7" y="9" width="280" height="328" fill="#eae4d8"/>
    <rect width="280" height="328" fill="#fffdf7"/>
    <path d="M0 1H280" stroke="#2b2925" stroke-width="2"/>
    <text x="25" y="43" font-family="sans-serif" font-size="14" fill="#625c52">아이의 한마디</text>
    <path d="M25 63H255" stroke="#d6cfc2"/>
    <g font-family="'Noto Serif KR', Georgia, serif" font-size="25" letter-spacing="-1" fill="#2b2925">
      <text x="24" y="121">“엄마, 달은 왜</text>
      <text x="24" y="165">자꾸 나를</text>
      <text x="24" y="209">따라와?”</text>
    </g>
    <path d="M25 260H255" stroke="#d6cfc2"/>
    <text x="25" y="292" font-family="sans-serif" font-size="13" fill="#746d62">오늘도 잊고 싶지 않은 말.</text>
    <text x="255" y="292" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#a44232">jr</text>
  </g>
</svg>
